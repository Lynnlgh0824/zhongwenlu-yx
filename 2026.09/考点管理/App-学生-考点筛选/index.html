<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>App-学生-考点筛选 · 中文路</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0;min-width:320px}.phone{max-width:430px;min-height:100vh;margin:auto;background:#f7f8fc;padding-bottom:78px;box-shadow:0 0 32px #dfe4ee}
    .top{height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #eef0f5;position:sticky;top:0;z-index:5}.top h1{font-size:18px;margin:0;font-weight:700}.back{font-size:22px;border:0;background:none;color:#24324a}.top .count{font-size:12px;color:#8b96aa}
    .hero{padding:20px 18px 16px;background:linear-gradient(135deg,#edf5ff,#fff);}.eyebrow{font-size:12px;color:#4b84e8;font-weight:700}.hero h2{margin:7px 0 6px;font-size:24px}.hero p{margin:0;color:#738097;font-size:13px;line-height:1.6}
    .panel{margin:14px 14px 0;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px #e9edf5}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel h3{font-size:16px;margin:0}.clear{border:0;background:none;color:#4b84e8;font-size:12px}.search{margin:14px 0 12px;height:40px;border:1px solid #e6eaf1;border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px}.search input{border:0;outline:0;font-size:13px;width:100%;color:#172033}.groups{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.groups button{white-space:nowrap;border:1px solid #e5eaf3;background:#fff;border-radius:18px;padding:7px 12px;color:#647189;font-size:12px}.groups button.active{background:#eaf2ff;border-color:#7ba8f4;color:#2874df;font-weight:600}
    .tags{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.tag{min-height:42px;border:1px solid #e8ecf3;border-radius:10px;background:#fff;color:#44516a;font-size:13px;cursor:pointer}.tag.selected{background:#e9f2ff;border-color:#5d98ef;color:#216bd3;font-weight:600}.tag small{display:block;color:#9aa5b7;font-size:10px;margin-top:3px}.tag.selected small{color:#6d9de2}
    .selected{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.chip{background:#eaf2ff;color:#2874df;border-radius:14px;padding:5px 9px;font-size:11px}.selected:empty{display:none}
    .result-head{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 10px}.result-head h3{margin:0;font-size:16px}.result-head span{color:#8b96aa;font-size:12px}.practice{margin:0 14px 10px;background:#fff;padding:15px;border-radius:14px;border:1px solid #eef0f5;display:flex;gap:12px;align-items:center}.badge{width:42px;height:42px;border-radius:12px;background:#fff1dc;color:#e79528;display:grid;place-items:center;font-size:20px}.practice:nth-of-type(2) .badge{background:#e8f7ef;color:#2ea866}.practice:nth-of-type(3) .badge{background:#f0eaff;color:#8054d6}.practice h4{margin:0 0 5px;font-size:14px}.practice p{margin:0;color:#8b96aa;font-size:11px}.go{margin-left:auto;color:#aab3c2;font-size:20px}.empty{padding:28px;text-align:center;color:#98a2b3;font-size:13px;display:none}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:66px;background:#fff;border-top:1px solid #edf0f5;display:flex;justify-content:space-around;padding-top:10px}.nav{font-size:11px;color:#9aa5b7;text-align:center}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:#2874df}
  </style>
</head>
<body>
<main class="phone">
  <header class="top"><button class="back" aria-label="返回">‹</button><h1>考点练习</h1><span class="count">学生端</span></header>
  <section class="hero"><div class="eyebrow">拼音专题</div><h2>按考点练习</h2><p>选择你想练习的考点，系统会为你推荐对应题目。</p></section>
  <section class="panel">
    <div class="panel-head"><h3>选择考点</h3><button class="clear" id="clear">清空已选</button></div>
    <label class="search">⌕<input id="search" placeholder="搜索考点名称" /></label>
    <div class="groups"><button class="active" data-group="all">全部</button><button data-group="shengmu">声母</button><button data-group="yunmu">韵母</button><button data-group="规则">拼写规则</button></div>
    <div class="tags" id="tags"></div><div class="selected" id="selected"></div>
  </section>
  <div class="result-head"><h3>推荐练习</h3><span id="resultCount">全部 6 组</span></div>
  <section id="results">
    <article class="practice" data-tags="平翘舌"><div class="badge">拼</div><div><h4>平翘舌辨析</h4><p>共 20 题 · 预计 5 分钟</p></div><span class="go">›</span></article>
    <article class="practice" data-tags="前后鼻音"><div class="badge">音</div><div><h4>前后鼻音专项</h4><p>共 15 题 · 预计 4 分钟</p></div><span class="go">›</span></article>
    <article class="practice" data-tags="声调变调"><div class="badge">调</div><div><h4>声调变调练习</h4><p>共 18 题 · 预计 5 分钟</p></div><span class="go">›</span></article>
  </section><div class="empty" id="empty">暂时没有匹配的练习，换个考点试试吧</div>
  <nav class="bottom"><div class="nav"><b>⌂</b>首页</div><div class="nav active"><b>✓</b>练习</div><div class="nav"><b>▤</b>错题</div><div class="nav"><b>◎</b>我的</div></nav>
</main>
<script>
  const data=[
    {name:'平翘舌',group:'shengmu',detail:'zh / ch / sh · z / c / s'},
    {name:'前后鼻音',group:'yunmu',detail:'an / en / in · ang / eng / ing'},
    {name:'人名拼写规则',group:'规则',detail:'姓名大小写与连接符'},
    {name:'地名拼写规则',group:'规则',detail:'专名与通名写法'},
    {name:'声调变调',group:'yunmu',detail:'上声、一、不变调'},
    {name:'边鼻音',group:'shengmu',detail:'n / l 辨析'}
  ];
  const selected=new Set(), tags=document.querySelector('#tags'), selectedEl=document.querySelector('#selected'), search=document.querySelector('#search'), empty=document.querySelector('#empty'), count=document.querySelector('#resultCount'); let group='all';
  function render(){const kw=search.value.trim().toLowerCase(); tags.innerHTML=''; data.filter(x=>(group==='all'||x.group===group)&&(!kw||x.name.toLowerCase().includes(kw))).forEach(x=>{const b=document.createElement('button');b.className='tag'+(selected.has(x.name)?' selected':'');b.innerHTML=x.name+'<small>'+x.detail+'</small>';b.onclick=()=>{selected.has(x.name)?selected.delete(x.name):selected.add(x.name);render()};tags.append(b)});selectedEl.innerHTML=[...selected].map(x=>'<span class="chip">'+x+'</span>').join(''); const cards=[...document.querySelectorAll('.practice')];let shown=0;cards.forEach(c=>{const ok=!selected.size||[...selected].some(x=>c.dataset.tags.includes(x));c.style.display=ok?'flex':'none';if(ok)shown++});empty.style.display=shown?'none':'block';count.textContent=(selected.size?'已筛选 '+shown:'全部 '+shown)+' 组'}
  document.querySelectorAll('.groups button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.groups button').forEach(x=>x.classList.remove('active'));b.classList.add('active');group=b.dataset.group;render()});search.oninput=render;document.querySelector('#clear').onclick=()=>{selected.clear();render()};document.querySelectorAll('.practice').forEach(x=>x.onclick=()=>alert('开始练习：'+x.querySelector('h4').textContent));render();
</script>
</body></html>
